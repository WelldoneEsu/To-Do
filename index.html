<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css?family=Poppins"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <script
      src="https://kit.fontawesome.com/127922d8a4.js"
      crossorigin="anonymous"
    ></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- Your CSS -->
    <link rel="stylesheet" href="index.css" />

    <title>TO DO LIST</title>
  </head>

  <body>
    <header>
      <h1>WELLDONE'S TO DO LIST</h1>
    </header>

    <p>
      A To-Do List is just a list of things you have to do. But writing them
      down is not enough — organizing and tracking them helps you stay
      productive.
    </p>

    <!-- FORM -->
    <form>
      <input
        type="text"
        class="todo-input"
        placeholder="Enter a task..."
      />

      <!-- ✅ FIXED: type="button" -->
      <button class="todo-button" type="button">
        <i class="fas fa-plus-square"></i>
      </button>

      <div class="select">
        <select name="todos" class="filter-todo">
          <option value="all">All</option>
          <option value="completed">Completed</option>
          <option value="uncompleted">Uncompleted</option>
        </select>
      </div>
    </form>

    <!-- TODO LIST -->
    <div class="todo-container">
      <ul class="todo-list"></ul>
    </div>

    <!-- ✅ BEST PRACTICE: defer -->
    <script src="index.js" defer></script>
  </body>
</html>
